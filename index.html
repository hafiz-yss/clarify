<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clarify — Context-Anchored AI Learning</title>
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="app-header">
      <div class="header-inner">
        <div class="brand">
          <span class="brand-dot"></span>
          <span class="brand-name">Clarify</span>
          <span class="brand-tag">Self-Organizing AI Learning Prototype</span>
        </div>
      </div>
    </header>

    <main id="workspace-grid" class="workspace-grid">
      <section id="main-spine" class="main-spine" aria-label="Main Learning Thread">
        <div id="chat-stream" class="chat-stream"></div>
      </section>

      <aside id="bucket-panel" class="bucket-panel hidden" aria-label="Clarification Bucket">
      </aside>
    </main>

    <footer class="prompt-dock">
      <div class="prompt-dock-inner">
        <div id="suggestion-chips" class="suggestion-chips">
          <button type="button" class="try-chip" data-prompt="Wait, what is Euler's totient function?">
            What is Euler's totient function?
          </button>
          <button type="button" class="try-chip" data-prompt="Why do we need a modular multiplicative inverse?">
            Why a modular multiplicative inverse?
          </button>
          <button type="button" class="try-chip" data-prompt="Okay, now show me how decryption works">
            How does decryption work?
          </button>
        </div>

        <form id="prompt-form" class="prompt-form">
          <input
            type="text"
            id="prompt-input"
            class="prompt-input"
            placeholder="Ask a question..."
            autocomplete="off"
          />
          <button type="submit" class="prompt-submit">Ask</button>
        </form>
      </div>
    </footer>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
