<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clarify — Context-Anchored AI Learning</title>
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <div id="workspace-grid" class="workspace-shell">
    <section id="main-spine" class="main-pane" aria-label="Main Learning Thread">
      <header class="pane-topbar">
        <div class="brand">
          <span class="brand-dot"></span>
          <span class="brand-name">Clarify</span>
          <span class="topic-divider">/</span>
          <span class="topic-title">RSA Public-Key Cryptography</span>
        </div>
      </header>

      <div class="main-scroll" id="main-scroll">
        <div id="chat-stream" class="chat-stream"></div>
      </div>

      <footer class="prompt-dock">
        <div class="prompt-dock-inner">
          <div id="suggestion-chips" class="suggestion-chips">
            <button type="button" class="try-chip" data-prompt="Wait, what is Euler's totient function?">
              What is Euler's totient function?
            </button>
            <button type="button" class="try-chip" data-prompt="Why do we need a modular multiplicative inverse?">
              Why a modular multiplicative inverse?
            </button>
            <button type="button" class="try-chip" data-prompt="Okay, now show me how decryption works">
              How does decryption work?
            </button>
          </div>

          <form id="prompt-form" class="prompt-composer">
            <input
              type="text"
              id="prompt-input"
              class="prompt-input"
              placeholder="Ask a question or clarify any concept..."
              autocomplete="off"
            />
            <button type="submit" class="btn btn-primary prompt-submit">Ask</button>
          </form>
        </div>
      </footer>
    </section>

    <aside id="bucket-panel" class="side-workbench" aria-label="Clarification Bucket" aria-hidden="true">
      <div id="bucket-panel-inner" class="side-workbench-card">
      </div>
    </aside>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
