<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://api.fontshare.com; font-src 'self' https://api.fontshare.com https://cdn.fontshare.com data:; img-src 'self' data:; connect-src 'self' https://generativelanguage.googleapis.com https://api.openai.com https://api.groq.com; object-src 'none'; base-uri 'self'; form-action 'self'"
  />
  <title>Clarify, Context-Anchored AI Learning</title>
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet" crossorigin />
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <div id="workspace-grid" class="workspace-shell">
    <!-- Collapsible Left Navigation Sidebar (like Claude / ChatGPT) -->
    <aside id="nav-sidebar" class="nav-sidebar" aria-label="Navigation Sidebar" aria-hidden="true">
      <div class="nav-sidebar-inner">
        <div class="nav-sidebar-header">
          <div class="brand">
            <span class="brand-dot"></span>
            <span class="brand-name">Clarify</span>
          </div>
          <button type="button" id="btn-close-sidebar" class="btn-icon btn-icon-close" aria-label="Close sidebar">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
          </button>
        </div>

        <button type="button" id="btn-new-chat" class="nav-new-chat-btn">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span>New Thread</span>
        </button>

        <div class="nav-section">
          <span class="nav-section-label">Threads</span>
          <div id="nav-thread-list" class="nav-thread-list">
            <!-- Populated dynamically with saved threads & Demo thread -->
          </div>
        </div>

        <div class="nav-sidebar-footer">
          <button type="button" id="btn-open-ai-settings" class="nav-mode-btn" title="Configure API Key">
            <span id="nav-mode-dot" class="mode-status-dot"></span>
            <span id="nav-mode-label">Connect API Key</span>
          </button>
        </div>
      </div>
    </aside>

    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <!-- Left Column: Full-Height Main Learning Pane (Header + Stream + Floating Prompt Dock) -->
    <section id="main-spine" class="main-pane" aria-label="Main Learning Thread">
      <header class="pane-topbar">
        <div class="topbar-left">
          <button type="button" id="btn-open-sidebar" class="btn-icon btn-sidebar-toggle" title="Toggle sidebar" aria-label="Toggle sidebar">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
          </button>
          <span id="topbar-topic-title" class="topic-title">New Thread</span>
        </div>
      </header>

      <div class="main-scroll" id="main-scroll">
        <div id="chat-stream" class="chat-stream"></div>
      </div>

      <footer class="prompt-dock">
        <div class="prompt-dock-inner">
          <div id="suggestion-chips" class="suggestion-chips hidden"></div>

          <form id="prompt-form" class="prompt-composer">
            <textarea
              id="prompt-input"
              class="prompt-input"
              rows="1"
              placeholder="Ask a question or clarify any concept..."
              autocomplete="off"
            ></textarea>
            <button type="submit" class="btn btn-primary prompt-submit">Ask</button>
          </form>
        </div>
      </footer>
    </section>

    <!-- Right Column: Full-Height Side Workbench (Claude Artifact-style proportion) -->
    <aside id="bucket-panel" class="side-workbench" aria-label="Clarification Bucket" aria-hidden="true">
      <div id="bucket-panel-inner" class="side-workbench-card">
        <!-- Populated dynamically when a Clarification Bucket opens -->
      </div>
    </aside>

    <!-- Floating Text-Selection "Clarify" Action Pill -->
    <button type="button" id="selection-clarify-btn" class="selection-clarify-btn hidden" aria-label="Clarify selected text">
      Clarify ↗
    </button>

    <!-- API Key Settings Modal (antigravity.google inspired minimal dialog) -->
    <div id="ai-settings-modal" class="settings-modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="settings-modal-title">
      <div class="settings-modal-card">
        <button type="button" id="btn-close-ai-settings" class="btn-icon btn-icon-close settings-modal-close" aria-label="Close settings">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>

        <div id="settings-disconnected-header" class="settings-modal-intro">
          <h2 id="settings-modal-title" class="settings-modal-title">Connect API Key</h2>
          <p id="settings-modal-desc" class="settings-modal-desc">
            Enter your API key to continue with live chat, or explore the interactive demo.
          </p>
        </div>

        <!-- Shown when API Key is Connected -->
        <div id="ai-connected-view" class="settings-connected-view hidden">
          <div class="settings-connected-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              <polyline points="9 12 11 14 15 10"></polyline>
            </svg>
          </div>
          <div class="settings-connected-text">
            <span class="settings-connected-title">API Connected</span>
            <span class="settings-connected-sub">Live chat and semantic routing are active.</span>
          </div>
        </div>

        <form id="ai-settings-form" class="settings-modal-form" autocomplete="off">
          <div id="ai-key-field" class="settings-field">
            <input
              type="text"
              id="ai-api-key-input"
              class="settings-input settings-key-masked"
              placeholder="Paste your API key..."
              aria-label="API Key"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
              data-1p-ignore="true"
              data-lpignore="true"
            />
          </div>
          <div id="ai-settings-feedback" class="settings-feedback hidden"></div>
          <div class="settings-modal-actions">
            <button type="button" id="btn-clear-api-key" class="btn settings-btn settings-btn-disconnect hidden">
              Disconnect Key
            </button>
            <button type="button" id="btn-modal-try-demo" class="btn settings-btn settings-btn-outline">
              Try Demo
            </button>
            <button type="submit" id="btn-save-api-key" class="btn settings-btn settings-btn-solid">
              Connect
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
